repos:
  # --- Ruff: lint (auto-fix safe rules) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Pytest: run test suite as a pre-commit gate ---
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest tests/ -x -q
        language: system
        types: [python]
        pass_filenames: false
